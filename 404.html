<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#065f46">
  <title>Página não encontrada | Quintal Suculento</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #14532d;
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom, #f0fdf4, #ecfdf5 35%, #f7fee7 100%);
    }
    img { width: 120px; height: auto; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2.2rem); letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: #166534; line-height: 1.6; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 16px;
      background: #166534;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(6, 95, 70, 0.25);
    }
    a.btn:hover { background: #14532d; }
    a.btn:focus-visible { outline: 3px solid #c7773b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo-cacto.webp" alt="Quintal Suculento" width="420" height="480">
    <h1>Essa página não foi encontrada</h1>
    <p>O endereço pode ter mudado ou não existe mais.<br>Que tal voltar para o nosso quintal?</p>

  </main>
</body>
</html>
